
name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    # Runs once per day at 03:17 UTC.
    - cron: "17 3 * * *"

# Required so the workflow can commit the generated JSON files.
permissions:
  contents: write

# Prevent overlapping manual/scheduled runs.
concurrency:
  group: google-scholar-citations
  cancel-in-progress: true

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r google_scholar_crawler/requirements.txt

      - name: Get citation data
        timeout-minutes: 2
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          GOOGLE_SCHOLAR_ID: FZvs20wAAAAJ
          PYTHONUNBUFFERED: "1"
        run: python -u google_scholar_crawler/main.py

      - name: Commit updated citation files
        shell: bash
        run: |
          set -euo pipefail

          git add \
            google_scholar_crawler/results/gs_data.json \
            google_scholar_crawler/results/gs_data_shieldsio.json

          if git diff --cached --quiet; then
            echo "Citation files did not change; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Google Scholar citations"
          git push
