name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    # Run once per day at 03:17 UTC. Low frequency reduces Scholar blocking.
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google_citation.yml"
      - "google_scholar_crawler/**"
      - "_config.yml"

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: true

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r google_scholar_crawler/requirements.txt

      - name: Get Google Scholar citation data
        timeout-minutes: 3
        env:
          GOOGLE_SCHOLAR_ID: FZvs20wAAAAJ
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail

          # Process-level timeout is a second guard beyond requests' own
          # connect/read timeouts. No API key or GitHub Secret is required.
          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            python -u google_scholar_crawler/main.py
          status=$?
          set -e

          if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
            echo "::error title=Crawler timed out::The crawler exceeded 120 seconds and was terminated. Existing citation data was preserved."
          fi
          exit "$status"

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s results/gs_data.json
          test -s results/gs_data_shieldsio.json
          python -m json.tool results/gs_data.json >/dev/null
          python -m json.tool results/gs_data_shieldsio.json >/dev/null
          echo "Generated files:"
          ls -lh results/gs_data*.json
          echo "Badge payload:"
          cat results/gs_data_shieldsio.json

      - name: Commit updated citation files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/gs_data.json results/gs_data_shieldsio.json

          if git diff --cached --quiet; then
            echo "Citation data did not change; nothing to commit."
            exit 0
          fi

          git commit -m "chore: update Google Scholar citations"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
